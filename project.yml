# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# then open EOSCalculator.xcodeproj.
name: EOSCalculator

options:
  bundleIdPrefix: org.example        # TODO: change to your reverse-DNS prefix before signing
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""             # TODO: your Apple Developer team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  EOSCalculatorCore:
    path: Packages/EOSCalculatorCore

targets:
  EOSCalculator:
    type: application
    platform: iOS
    sources:
      - path: EOSCalculator
    dependencies:
      - package: EOSCalculatorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.eoscalculator   # TODO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: EOSCalculator/Info.plist
      properties:
        CFBundleDisplayName: EOS Risk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  EOSCalculator:
    build:
      targets:
        EOSCalculator: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EOSCalculatorCore/EOSCalculatorCoreTests
    archive:
      config: Release
